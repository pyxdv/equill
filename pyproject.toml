[project]
name = "equill"
version = "1.1.0"
description = "ISO/IEC 25010 quality evidence from Semgrep and Cppcheck findings, for CI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0", "pyyaml>=6.0", "ruff>=0.6"]

[project.scripts]
equill = "equill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equill"]

[tool.ruff]
line-length = 100
target-version = "py311"
# sample/ is deliberately vulnerable code for the CI scan.
extend-exclude = ["sample"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: typer declares options as call defaults by design.
ignore = ["B008", "E501"]  # E501: modules are kept line-for-line with quill
