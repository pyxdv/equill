name: equill ISO/IEC 25010 quality evidence
description: >-
  Map Opengrep, Semgrep or Cppcheck findings to ISO/IEC 25010 quality
  characteristics; write SARIF and a job summary; optionally gate the build.
  Open rules by default, deterministic, no LLM, GPU or login.
author: pyxdv
branding:
  icon: check-square
  color: blue

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: .
  scanner:
    description: opengrep (default; installed by the action on Linux and macOS runners) | semgrep (installed by the action) | cppcheck.
    default: opengrep
  config:
    description: >-
      auto (default) uses the open opengrep-rules (LGPL-2.1 + Commons Clause)
      for the languages in the repository with Opengrep, and p/default with
      Semgrep. Otherwise registry packs or rule paths, comma-separated.
    default: auto
  scanner-output:
    description: >-
      A scan your workflow already produced: a Semgrep JSON (set scanner:
      semgrep, or opengrep for an Opengrep JSON) or a Cppcheck XML (with
      scanner: cppcheck). When set, equill maps it instead of running (or
      installing) a scanner.
    default: ''
  fail-on:
    description: >-
      Comma-separated characteristics (e.g. security,reliability, or all). The
      step fails when any of them has an actionable finding. Empty means never.
    default: ''
  max-actionable:
    description: 'Fail when the scan has more actionable findings than this. Empty: no limit.'
    default: ''
  output-dir:
    description: Where report.json, report.sarif, scores.json and summary.md are written.
    default: equill-report
  opengrep-version:
    description: Opengrep release to install. The default is pinned and checksum-verified.
    default: v1.30.2
  opengrep-sha256:
    description: >-
      SHA-256 of the Opengrep binary for this runner, required when
      opengrep-version is not the pinned default.
    default: ''
  semgrep-version:
    description: 'Semgrep version to install when scanner is semgrep (e.g. 1.95.0). Empty installs the latest.'
    default: ''
  python-version:
    description: Python used to run equill and Semgrep.
    default: '3.12'

outputs:
  report:
    description: Path to report.json.
    value: ${{ steps.run.outputs.report }}
  sarif:
    description: Path to report.sarif (SARIF 2.1.0, for github/codeql-action/upload-sarif).
    value: ${{ steps.run.outputs.sarif }}
  scores:
    description: Path to scores.json.
    value: ${{ steps.run.outputs.scores }}
  summary:
    description: Path to summary.md (also appended to the job summary).
    value: ${{ steps.run.outputs.summary }}
  findings:
    description: Number of scanner findings.
    value: ${{ steps.run.outputs.findings }}
  mapped:
    description: Findings mapped to ISO/IEC 25010.
    value: ${{ steps.run.outputs.mapped }}
  actionable:
    description: Actionable mapped findings (what the gate counts).
    value: ${{ steps.run.outputs.actionable }}
  sites:
    description: Distinct places to fix among the actionable findings.
    value: ${{ steps.run.outputs.sites }}
  gate:
    description: passed or failed.
    value: ${{ steps.run.outputs.gate }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: ${{ inputs.python-version }}
        # Keep the caller's Python: only this action's steps use this one,
        # through steps.python.outputs.python-path.
        update-environment: false

    - name: Install equill
      shell: bash
      env:
        PY: ${{ steps.python.outputs.python-path }}
      run: |
        "$PY" -m venv "$RUNNER_TEMP/equill-venv"
        "$RUNNER_TEMP/equill-venv/bin/python" -m pip install --quiet --upgrade pip
        "$RUNNER_TEMP/equill-venv/bin/python" -m pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Install Opengrep
      if: inputs.scanner == 'opengrep' && inputs.scanner-output == ''
      shell: bash
      env:
        OPENGREP_VERSION: ${{ inputs.opengrep-version }}
        OPENGREP_SHA256: ${{ inputs.opengrep-sha256 }}
      # The single static binary from Opengrep's GitHub release, checked against
      # a pinned SHA-256. Kept in its own directory and put on PATH for the
      # scan step only, like Semgrep below.
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$(uname -m)" in
          Linux/x86_64|Linux/amd64) asset=opengrep_manylinux_x86
            pinned=a66aa3278457f02b287b985a45b6762aebcaba5000f2689245fd1ed86d1456c7 ;;
          Linux/aarch64|Linux/arm64) asset=opengrep_manylinux_aarch64
            pinned=90acea5df4b733083f388d4feeb250ca802f671b33d1f222653d1e571dd2b0d8 ;;
          macOS/arm64) asset=opengrep_osx_arm64
            pinned=f1aaa30b88959cb82522c4e1475816278a1f161f994509a518453c0455f9d24b ;;
          macOS/x86_64) asset=opengrep_osx_x86
            pinned=fcf47da30d5c3a11119f2ec4e0d1ee55e3c3822e8f90d909bf9f33dfce99044a ;;
          *) echo "::error::equill installs Opengrep on Linux and macOS runners; got $RUNNER_OS/$(uname -m). Use scanner: semgrep or scanner-output."; exit 1 ;;
        esac
        expected="$OPENGREP_SHA256"
        if [ -z "$expected" ]; then
          if [ "$OPENGREP_VERSION" != "v1.30.2" ]; then
            echo "::error::opengrep-version $OPENGREP_VERSION needs opengrep-sha256 (only v1.30.2 is pinned)"; exit 1
          fi
          expected="$pinned"
        fi
        dir="$RUNNER_TEMP/opengrep-bin"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/opengrep" \
          "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/$asset"
        if command -v sha256sum >/dev/null; then
          echo "$expected  $dir/opengrep" | sha256sum -c -
        else
          echo "$expected  $dir/opengrep" | shasum -a 256 -c -
        fi
        chmod +x "$dir/opengrep"
        "$dir/opengrep" --version

    - name: Install Semgrep
      if: inputs.scanner == 'semgrep' && inputs.scanner-output == ''
      shell: bash
      env:
        PY: ${{ steps.python.outputs.python-path }}
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      # Its own venv: Semgrep pins click and friends, and must not move equill's.
      # Not added to GITHUB_PATH, which would put this venv's python and pip
      # ahead of the caller's for the rest of their job; the scan step below
      # puts it on PATH for itself only.
      run: |
        "$PY" -m venv "$RUNNER_TEMP/semgrep-venv"
        "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --quiet \
          "semgrep${SEMGREP_VERSION:+==$SEMGREP_VERSION}"

    - name: Install Cppcheck
      if: inputs.scanner == 'cppcheck' && inputs.scanner-output == ''
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq cppcheck

    - name: Scan, map and summarise
      id: run
      shell: bash
      env:
        EQUILL_BIN: ${{ runner.temp }}/equill-venv/bin/equill
        EQUILL_PYTHON: ${{ runner.temp }}/equill-venv/bin/python
        EQUILL_PATH: ${{ inputs.path }}
        EQUILL_SCANNER: ${{ inputs.scanner }}
        EQUILL_CONFIG: ${{ inputs.config }}
        EQUILL_SCANNER_OUTPUT: ${{ inputs.scanner-output }}
        EQUILL_OUTPUT_DIR: ${{ inputs.output-dir }}
        EQUILL_FAIL_ON: ${{ inputs.fail-on }}
        EQUILL_MAX_ACTIONABLE: ${{ inputs.max-actionable }}
        EQUILL_NAME: ${{ github.event.repository.name }}
      run: PATH="$RUNNER_TEMP/opengrep-bin:$RUNNER_TEMP/semgrep-venv/bin:$PATH" bash "$GITHUB_ACTION_PATH/scripts/equill_action.sh"
